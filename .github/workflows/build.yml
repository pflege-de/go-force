on: [push]
name: build
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Go build and test
    strategy:
      matrix:
        go-version: ["stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # https://github.com/actions/setup-go/releases/tag/v6.3.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod download && go mod verify
      - name: Test with Go
        run: go test -v -cover -race ./...
